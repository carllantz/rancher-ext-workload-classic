# workload-classic Rancher UI extension — direct install via kubectl.
#
# This is the same resource the Helm chart would create. Use it only if you are
# installing without the Extensions UI / Helm repo. The namespace
# cattle-ui-plugin-system and the ui-plugin-operator must already exist, which
# they do once Rancher extension support is enabled (☰ → Extensions → Enable).
#
#   kubectl apply -f deploy/workload-classic-uiplugin.yaml
#
# After it reconciles (status.cacheState: cached), reload the Rancher browser tab.
# "All Workloads" appears at the bottom of the Workloads group in Cluster Explorer.
apiVersion: catalog.cattle.io/v1
kind: UIPlugin
metadata:
  name: workload-classic
  namespace: cattle-ui-plugin-system
spec:
  plugin:
    name: workload-classic
    version: 0.1.3

    # Directory that holds package.json + workload-classic-0.1.3.umd.min.js.
    # NOTE the trailing /plugin — the bundle lives one level below the version dir.
    endpoint: https://raw.githubusercontent.com/carllantz/rancher-ext-workload-classic/gh-pages/extensions/workload-classic/0.1.3/plugin

    # Tarball the ui-plugin-operator downloads and caches, then serves from
    # Rancher's own origin. Required for noCache: false.
    compressedEndpoint: https://raw.githubusercontent.com/carllantz/rancher-ext-workload-classic/gh-pages/extensions/workload-classic/0.1.3.tgz

    # false => operator caches and serves the bundle (works even when the
    # dashboard won't direct-load an external, uncached plugin).
    noCache: false
    noAuth: true

    # REQUIRED. Without these annotations the dashboard rejects the plugin with
    # plugins.error.apiAnnotationMissing and never loads it (no nav entry, and a
    # direct URL hits the fail-whale). The build strips the source package.json's
    # rancher.annotations to `"rancher": true`, so the compatibility versions must
    # be supplied here on the CR.
    metadata:
      catalog.cattle.io/rancher-version: ">= 2.14.0"
      catalog.cattle.io/ui-extensions-version: ">= 3.0.0 < 4.0.0"
